services:
  - type: web
    name: campusepulse-api
    runtime: node
    plan: free
    region: oregon
    rootDir: CampusePulse-API
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_LOCAL_STORE
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: CORS_ORIGIN
        value: https://campus-pulse-f8d7a.web.app,https://campus-pulse-f8d7a.firebaseapp.com,http://localhost:5173
